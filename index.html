<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URANUSN — Portfolio</title>
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("outputs/assets/type/CormorantGaramond-VariableFont_wght.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Cormorant Garamond";
      src: url("outputs/assets/type/CormorantGaramond-Italic-VariableFont_wght.ttf") format("truetype");
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
    }

    :root {
      --text: #eef8ff;
      --text-dim: rgba(238, 248, 255, 0.62);
      --gold: #d4b87a;
      --gold-dim: rgba(212, 184, 122, 0.45);
      --nav-h: 72px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      /* proximity：Page 1/2 边界可吸附，Page 2 内部可自由 scrub */
      scroll-snap-type: y proximity;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      overflow-x: hidden;
      overflow-y: auto;
      cursor: none;
    }

    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      transform: translate(-50%, -50%);
      transition: width 0.15s ease, height 0.15s ease;
    }

    .cursor-default {
      width: 48px;
      height: 48px;
      background-image: url("outputs/assets/cursor/cursor-default.svg");
    }

    .cursor-hover {
      width: 56px;
      height: 56px;
      background-image: url("outputs/assets/cursor/cursor-hover.svg");
    }

    .cursor-click {
      width: 64px;
      height: 64px;
      background-image: url("outputs/assets/cursor/cursor-click.svg");
    }

    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 0;
      pointer-events: none;
    }

    #cursor-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      pointer-events: none;
      z-index: 10;
    }

    .pages {
      position: relative;
      z-index: 1;
    }

    .page,
    #page-1,
    #page-2 {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: transparent;
      position: relative;
    }

    #page-1,
    #page-2 {
      scroll-snap-align: start;
    }

    /* 进入 Page 1 时强制停住；Page 2 不设 stop，便于继续滚动驱动帧序列 */
    #page-1 {
      scroll-snap-stop: always;
    }

    .page__content {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: min(88vw, 920px);
      text-align: center;
      opacity: 0;
      will-change: transform, opacity;
      pointer-events: none;
    }

    .page__content--left {
      left: calc(clamp(24px, 4vw, 64px) - 80px);
      top: 50%;
      width: auto;
      max-width: min(520px, 46vw);
      text-align: left;
      transform: translateY(-50%);
    }

    .page__folio-img {
      display: block;
      width: 100%;
      height: auto;
      animation: folio-glow 2.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes folio-glow {
      0%, 100% {
        opacity: 0.3;
        filter:
          drop-shadow(0 0 3px rgba(255, 255, 255, 0.1))
          drop-shadow(0 0 14px rgba(255, 232, 153, 0.08));
      }
      50% {
        opacity: 1;
        filter:
          drop-shadow(0 0 8px rgba(255, 255, 255, 0.26))
          drop-shadow(0 0 26px rgba(255, 232, 153, 0.2));
      }
    }

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      z-index: 20;
      display: flex;
      align-items: center;
      padding: 0 clamp(24px, 4vw, 64px);
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.42), transparent);
      pointer-events: auto;
    }

    .nav__logo {
      height: clamp(28px, 4vw, 40px);
      width: auto;
      opacity: 0.95;
    }

    .nav__links {
      position: absolute;
      right: clamp(24px, 4vw, 64px);
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0;
      list-style: none;
    }

    .nav__links li {
      display: flex;
      align-items: center;
    }

    .nav__links a {
      color: #ffe899;
      text-decoration: underline;
      text-underline-offset: 0.32em;
      text-decoration-thickness: 0.5px;
      font-size: clamp(15px, 1.38vw, 17px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 2px rgba(255, 255, 255, 0.3);
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .nav__links a:hover,
    .nav__links a.is-active {
      color: #ffe899;
      text-shadow:
        0 0 2px rgba(255, 255, 255, 0.3),
        0 0 10px rgba(255, 255, 255, 0.18);
    }

    .nav__sep {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      pointer-events: none;
      /* INTRO↔dot、dot↔MUTE 间距：原 14–22px 缩小 20% */
      margin-inline: clamp(11px, 1.6vw, 18px);
    }

    .nav__sep img {
      display: block;
      width: auto;
      height: 8px;
      filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.3));
    }

    .page__title {
      font-size: clamp(42px, 7vw, 82px);
      font-weight: 300;
      font-style: italic;
      line-height: 1.05;
      letter-spacing: 0.04em;
      color: var(--text);
      text-shadow: 0 2px 28px rgba(0, 0, 0, 0.45);
    }

    .page__subtitle {
      margin-top: clamp(14px, 2vh, 24px);
      font-size: clamp(15px, 1.8vw, 20px);
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .page__btn {
      display: inline-block;
      margin-top: clamp(28px, 4vh, 48px);
      padding: 14px 34px;
      border: 1px solid var(--gold-dim);
      border-radius: 999px;
      color: var(--gold);
      font-size: clamp(13px, 1.2vw, 15px);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(4px);
      pointer-events: auto;
      cursor: pointer;
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .page__btn:hover {
      border-color: var(--gold);
      background: rgba(212, 184, 122, 0.08);
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #000;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader__bar {
      width: min(320px, 72vw);
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
      border-radius: 2px;
    }

    .loader__bar span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--gold);
      transition: width 0.15s ease;
      border-radius: 2px;
    }

    .loader__text {
      font-size: 14px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(238, 248, 255, 0.82);
    }

    .loader__percent {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--gold);
    }

    .scroll-hint {
      position: fixed;
      left: 50%;
      bottom: clamp(20px, 4vh, 36px);
      transform: translateX(-50%);
      z-index: 15;
      font-size: 11px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(238, 248, 255, 0.46);
      pointer-events: none;
      animation: hint-pulse 2.4s ease-in-out infinite;
    }

    @keyframes hint-pulse {
      0%, 100% { opacity: 0.42; transform: translateX(-50%) translateY(0); }
      50% { opacity: 0.84; transform: translateX(-50%) translateY(6px); }
    }

    body.modal-open {
      overflow: hidden;
      touch-action: none;
    }

    .intro-modal {
      position: fixed;
      inset: 0;
      z-index: 9500;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      visibility: hidden;
    }

    .intro-modal:not([hidden]) {
      visibility: visible;
    }

    .intro-modal.is-active {
      pointer-events: auto;
    }

    .intro-modal__shader {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(72, 96, 128, 0.22), transparent 58%),
        rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 0.38s ease;
    }

    .intro-modal.is-active .intro-modal__shader {
      opacity: 1;
    }

    .intro-modal.is-closing .intro-modal__shader {
      opacity: 0;
      transition-duration: 0.42s;
    }

    .intro-modal__stage {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .intro-modal__parchment {
      position: relative;
      width: min(720px, 86vw);
      pointer-events: auto;
      overflow: visible;
      will-change: transform, opacity;
      transform: translateY(-120px) scale(0.96) rotate(-1.2deg);
      opacity: 0;
    }

    @media (max-width: 768px) {
      .intro-modal__parchment {
        width: 92vw;
      }
    }

    .intro-modal__parchment img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .intro-hit {
      position: absolute;
      background: transparent;
      border: none;
      outline: none;
      padding: 0;
      margin: 0;
      cursor: none;
      -webkit-tap-highlight-color: transparent;
    }

    .intro-hit:focus-visible {
      outline: none;
    }

    /* 坐标来自 SVG viewBox 456×426：close ≈ 87% / 0%，lang ≈ 73% / 0% */
    .intro-hit--close {
      top: 0.5%;
      left: 83%;
      width: 12%;
      height: 11%;
    }

    .intro-hit--lang {
      top: 0.5%;
      left: 69%;
      width: 15%;
      height: 13%;
    }

    .intro-modal.is-opening .intro-modal__parchment,
    .intro-modal.is-active:not(.is-closing) .intro-modal__parchment {
      animation: parchment-drop 0.88s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .intro-modal.is-closing .intro-modal__parchment {
      animation: parchment-rise 0.46s cubic-bezier(0.55, 0.06, 0.68, 0.19) forwards;
    }

    @keyframes parchment-drop {
      0% {
        transform: translateY(-120px) scale(0.96) rotate(-1.2deg);
        opacity: 0;
      }
      68% {
        transform: translateY(10px) scale(1.012) rotate(0.6deg);
        opacity: 1;
      }
      86% {
        transform: translateY(-4px) scale(0.998) rotate(-0.2deg);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes parchment-rise {
      0% {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-96px) scale(0.97) rotate(-0.8deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="cursor cursor-default" id="cursor" aria-hidden="true"></div>

  <div class="loader" id="loader">
    <p class="loader__percent" id="loaderPercent">0%</p>
    <div class="loader__bar"><span id="loaderProgress"></span></div>
    <p class="loader__text" id="loaderText">Loading frames 0 / 271</p>
  </div>

  <canvas id="bgCanvas"></canvas>
  <canvas id="cursor-canvas"></canvas>
  <audio id="bgAudio" src="outputs/assets/videos/hero-video.mp4" preload="auto"></audio>

  <header class="nav">
    <img class="nav__logo" src="outputs/assets/images/page1/logo.png" alt="URANUSN">
    <ul class="nav__links" id="navLinks">
      <li><a href="#" id="introOpenBtn">INTRO</a></li>
      <li class="nav__sep" aria-hidden="true">
        <img src="outputs/assets/images/whole/buttons/buttons_p1/dot.png" alt="">
      </li>
      <li><a href="#" id="soundToggle">MUTE</a></li>
    </ul>
  </header>

  <main class="pages">
    <section class="page" id="page-1">
      <div class="page__content page__content--left" id="page1Content">
        <img class="page__folio-img" src="outputs/assets/images/page1/folio.png" alt="portfolio">
      </div>
    </section>
    <section class="page" id="page-2">
      <div class="page__content" id="page2Content">
        <h1 class="page__title">Portfolio</h1>
        <p class="page__subtitle">Selected works across film, motion, and design</p>
        <button class="page__btn" type="button">View Projects</button>
      </div>
    </section>
  </main>

  <p class="scroll-hint" id="scrollHint">Scroll to explore</p>

  <div id="introModal" class="intro-modal" hidden aria-hidden="true">
    <div class="intro-modal__shader" aria-hidden="true"></div>
    <div class="intro-modal__stage">
      <div class="intro-modal__parchment">
        <img
          id="introParchmentImg"
          src="outputs/assets/images/whole/profile/chinese_profile.svg"
          alt="Personal Introduction"
          draggable="false"
        >
        <button
          type="button"
          class="intro-hit intro-hit--close"
          id="introCloseHit"
          aria-label="Close introduction"
        ></button>
        <button
          type="button"
          class="intro-hit intro-hit--lang"
          id="introLangHit"
          aria-label="Switch to English"
        ></button>
      </div>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════
       可调参数 CONFIG
       ═══════════════════════════════════════════ */
    const CONFIG = {
      fps: 30,
      totalFrames: 271,
      page1EndFrame: 150,   // 0s → 5s
      page2StartFrame: 151, // 5s 起
      page2EndFrame: 271,   // 5s → 9s（视频结尾）
      videoFile: "hero-video.mp4",
      framePath: (i) => `frames/frame_${String(i).padStart(4, "0")}.webp`,

      // 文字动画
      textFadeInStart: 0.68,
      textFadeInEnd: 1.0,
      textFadeOutRatio: 0.14,
      textSlideDistance: 42,
      textTransitionSmooth: 0.12,

      // 预加载
      preloadAhead: 30,
    };

    /* ═══════════════════════════════════════════
       时间节点（hero-video.mp4 ≈ 9s，30fps，共 271 帧）
       Page 1：帧 1–150（0s → 5s）自动播放
       Page 2：帧 151–271（5s → 9s）进入后自动播放
       ═══════════════════════════════════════════ */
    const NODES = [
      {
        startFrame: 1,
        endFrame: 150,
        navLabel: "INTRO",
        title: "Beyond the Silence",
        subtitle: "A cinematic prelude to URANUSN",
        cta: "Begin Journey",
      },
      {
        startFrame: 151,
        endFrame: 271,
        navLabel: "Page 2",
        title: "Portfolio",
        subtitle: "Selected works across film, motion, and design",
        cta: "View Projects",
      },
    ];

    /* ═══════════════════════════════════════════
       DOM & State
       ═══════════════════════════════════════════ */
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");
    const page1 = document.getElementById("page-1");
    const page2 = document.getElementById("page-2");
    const page1Content = document.getElementById("page1Content");
    const page2Content = document.getElementById("page2Content");
    const loader = document.getElementById("loader");
    const loaderProgress = document.getElementById("loaderProgress");
    const loaderText = document.getElementById("loaderText");
    const loaderPercent = document.getElementById("loaderPercent");
    const navLinks = document.getElementById("navLinks");
    const soundToggle = document.getElementById("soundToggle");
    const bgAudio = document.getElementById("bgAudio");
    const scrollHint = document.getElementById("scrollHint");

    const frames = new Array(CONFIG.totalFrames + 1);
    const loadingPromises = new Map();
    let loadedFrameCount = 0;

    let introFrame = 1;
    let page2Frame = CONFIG.page2StartFrame;
    let introDone = false;
    let page2Done = false;
    let wasOnPage1 = true;
    let scrollDirection = 1;
    let currentFrame = 1;
    let displayedFrame = 1;
    let isReady = false;
    let lastActiveNode = -1;
    let soundEnabled = true;

    const pageContentState = {
      page1: { opacity: 0, translateY: 0 },
      page2: { opacity: 0, translateY: 0 },
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function getPage2FrameSpan() {
      return CONFIG.page2EndFrame - CONFIG.page2StartFrame;
    }

    function isOnPage1() {
      return window.scrollY < page2.offsetTop - 2;
    }

    function getPage2PlaybackProgress() {
      if (page2Done) return 1;
      return clamp((page2Frame - CONFIG.page2StartFrame) / getPage2FrameSpan(), 0, 1);
    }

    function getActiveNodeIndex() {
      return isOnPage1() ? 0 : 1;
    }

    /* ═══════════════════════════════════════════
       帧加载
       ═══════════════════════════════════════════ */
    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = "async";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`Failed: ${url}`));
        img.src = url;
      });
    }

    function updateLoaderUI() {
      const pct = (loadedFrameCount / CONFIG.totalFrames) * 100;
      loaderProgress.style.width = `${pct}%`;
      loaderPercent.textContent = `${Math.round(pct)}%`;
      loaderText.textContent = `Loading frames ${loadedFrameCount} / ${CONFIG.totalFrames}`;
    }

    function markFrameLoaded() {
      loadedFrameCount = 0;
      for (let i = 1; i <= CONFIG.totalFrames; i++) {
        if (frames[i]) loadedFrameCount++;
      }
      updateLoaderUI();
      if (loadedFrameCount >= CONFIG.totalFrames) {
        isReady = true;
        loaderPercent.textContent = "100%";
        loaderText.textContent = "Ready";
        setTimeout(() => loader.classList.add("is-hidden"), 600);
      }
    }

    async function ensureFrame(index) {
      const idx = Math.max(1, Math.min(CONFIG.totalFrames, Math.round(index)));
      if (frames[idx]) return frames[idx];
      if (loadingPromises.has(idx)) return loadingPromises.get(idx);

      const promise = loadImage(CONFIG.framePath(idx))
        .then((img) => {
          frames[idx] = img;
          loadingPromises.delete(idx);
          markFrameLoaded();
          return img;
        })
        .catch((err) => {
          loadingPromises.delete(idx);
          console.warn(err.message);
          return null;
        });

      loadingPromises.set(idx, promise);
      return promise;
    }

    async function preloadFrames() {
      const concurrency = 8;

      for (let start = 1; start <= CONFIG.totalFrames; start += concurrency) {
        const end = Math.min(CONFIG.totalFrames, start + concurrency - 1);
        const batch = [];

        for (let i = start; i <= end; i++) {
          batch.push(ensureFrame(i));
        }

        await Promise.all(batch);
      }

      if (loadedFrameCount < CONFIG.totalFrames) {
        loaderText.textContent = `Loaded ${loadedFrameCount} / ${CONFIG.totalFrames}, continuing…`;
      }
    }

    function preloadAroundFrame(frameIndex) {
      const center = Math.round(frameIndex);
      for (let i = center - CONFIG.preloadAhead; i <= center + CONFIG.preloadAhead; i++) {
        if (i >= 1 && i <= CONFIG.totalFrames && !frames[i] && !loadingPromises.has(i)) {
          ensureFrame(i);
        }
      }
    }

    /* ═══════════════════════════════════════════
       Canvas 渲染
       ═══════════════════════════════════════════ */
    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawCover(img) {
      if (!img) return;
      const cw = window.innerWidth;
      const ch = window.innerHeight;
      const ir = img.width / img.height;
      const cr = cw / ch;
      let dw, dh, dx, dy;

      if (ir > cr) {
        dh = ch;
        dw = dh * ir;
        dx = (cw - dw) * 0.5;
        dy = 0;
      } else {
        dw = cw;
        dh = dw / ir;
        dx = 0;
        dy = (ch - dh) * 0.5;
      }

      ctx.drawImage(img, dx, dy, dw, dh);
    }

    function renderFrame(frameIndex) {
      const idx = Math.max(1, Math.min(CONFIG.totalFrames, Math.round(frameIndex)));
      const img = frames[idx];

      if (!img) {
        ensureFrame(idx).then((loaded) => {
          if (loaded && Math.round(currentFrame) === idx) {
            drawCover(loaded);
            displayedFrame = idx;
          }
        });
        return;
      }

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      drawCover(img);
      displayedFrame = idx;
    }

    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0 || 1)));
      return t * t * (3 - 2 * t);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function applyPageContent(el, state, targetOpacity, targetY) {
      state.opacity = lerp(state.opacity, targetOpacity, CONFIG.textTransitionSmooth);
      state.translateY = lerp(state.translateY, targetY, CONFIG.textTransitionSmooth);
      el.style.opacity = state.opacity.toFixed(3);
      const isLeft = el.classList.contains("page__content--left");
      el.style.transform = isLeft
        ? `translateY(calc(-50% + ${state.translateY.toFixed(2)}px))`
        : `translate(-50%, calc(-50% + ${state.translateY.toFixed(2)}px))`;
      el.style.pointerEvents = state.opacity > 0.4 ? "auto" : "none";
    }

    function updateContentUI() {
      const activeNode = getActiveNodeIndex();
      const page2Progress = isOnPage1() ? 0 : getPage2PlaybackProgress();
      const page1Progress = introDone
        ? 1
        : clamp(introFrame / CONFIG.page1EndFrame, 0, 1);

      if (activeNode !== lastActiveNode) {
        lastActiveNode = activeNode;
        navLinks.querySelectorAll("a[data-node]").forEach((a) => {
          a.classList.toggle("is-active", Number(a.dataset.node) === activeNode);
        });
      }

      let page1Opacity = 0;
      let page1Y = scrollDirection > 0 ? CONFIG.textSlideDistance : -CONFIG.textSlideDistance;
      let page2Opacity = 0;
      let page2Y = scrollDirection > 0 ? CONFIG.textSlideDistance : -CONFIG.textSlideDistance;

      if (isOnPage1()) {
        const fadeIn = smoothstep(CONFIG.textFadeInStart, CONFIG.textFadeInEnd, page1Progress);
        const fadeOut = page1Progress < CONFIG.textFadeOutRatio
          ? page1Progress / CONFIG.textFadeOutRatio
          : 1;
        page1Opacity = fadeIn * fadeOut;
        const slideBase = (1 - fadeIn) * CONFIG.textSlideDistance;
        page1Y = scrollDirection > 0 ? slideBase : -slideBase;
      } else {
        const fadeIn = smoothstep(CONFIG.textFadeInStart, CONFIG.textFadeInEnd, page2Progress);
        const fadeOut = page2Progress < CONFIG.textFadeOutRatio
          ? page2Progress / CONFIG.textFadeOutRatio
          : 1;
        page2Opacity = fadeIn * fadeOut;
        const slideBase = (1 - fadeIn) * CONFIG.textSlideDistance;
        page2Y = scrollDirection > 0 ? slideBase : -slideBase;

        const page1FadeOut = 1 - smoothstep(0, CONFIG.textFadeOutRatio, page2Progress);
        page1Opacity = page1FadeOut * 0.35;
        page1Y = scrollDirection > 0 ? -CONFIG.textSlideDistance * 0.5 : CONFIG.textSlideDistance * 0.5;
      }

      applyPageContent(page1Content, pageContentState.page1, page1Opacity, page1Y);
      applyPageContent(page2Content, pageContentState.page2, page2Opacity, page2Y);

      if (isOnPage1()) {
        scrollHint.textContent = introDone ? "Scroll down" : "Scroll to explore";
        scrollHint.style.opacity = String(introDone ? 0.6 : Math.max(0, 0.48 - page1Progress * 0.48));
      } else {
        scrollHint.style.opacity = String(Math.max(0, 0.6 - page2Progress));
      }
    }

    /* ═══════════════════════════════════════════
       播放 & 主循环
       ═══════════════════════════════════════════ */
    let lastScrollY = window.scrollY;

    function updatePlayback() {
      const onPage1 = isOnPage1();

      if (onPage1) {
        if (!wasOnPage1) {
          page2Frame = CONFIG.page2StartFrame;
          page2Done = false;
        }
        wasOnPage1 = true;

        if (!introDone) {
          introFrame += CONFIG.fps / 60;
          if (introFrame >= CONFIG.page1EndFrame) {
            introFrame = CONFIG.page1EndFrame;
            introDone = true;
          }
          currentFrame = introFrame;
        } else {
          currentFrame = CONFIG.page1EndFrame;
        }
        return;
      }

      if (wasOnPage1) {
        page2Frame = CONFIG.page2StartFrame;
        page2Done = false;
        introDone = true;
      }
      wasOnPage1 = false;

      if (!page2Done) {
        page2Frame += CONFIG.fps / 60;
        if (page2Frame >= CONFIG.page2EndFrame) {
          page2Frame = CONFIG.page2EndFrame;
          page2Done = true;
        }
      }
      currentFrame = page2Frame;
    }

    function onScroll() {
      const currentScrollY = window.scrollY;
      scrollDirection = currentScrollY > lastScrollY ? 1 : currentScrollY < lastScrollY ? -1 : scrollDirection;
      lastScrollY = currentScrollY;
    }

    function tick() {
      updatePlayback();
      syncAudio();

      preloadAroundFrame(currentFrame);

      if (Math.round(displayedFrame) !== Math.round(currentFrame)) {
        renderFrame(currentFrame);
      }

      updateContentUI();
      requestAnimationFrame(tick);
    }

    /* ═══════════════════════════════════════════
       导航 & 全局音乐
       ═══════════════════════════════════════════ */
    function jumpToNode(nodeIndex) {
      if (nodeIndex === 0) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        window.scrollTo({ top: window.innerHeight, behavior: "smooth" });
      }
    }

    function updateSoundToggleUI() {
      // 按钮显示「点击后的动作」：有声时显示 MUTE，静音时显示 SOUND
      soundToggle.textContent = soundEnabled ? "MUTE" : "SOUND";
      soundToggle.classList.toggle("is-active", soundEnabled);
    }

    function syncAudio() {
      if (!soundEnabled) {
        bgAudio.pause();
        return;
      }

      const targetTime = (currentFrame - 1) / CONFIG.fps;
      if (Math.abs(bgAudio.currentTime - targetTime) > 0.12) {
        bgAudio.currentTime = targetTime;
      }

      if (bgAudio.paused) {
        bgAudio.play().catch(() => {});
      }
    }

    navLinks.addEventListener("click", (event) => {
      const link = event.target.closest("a[data-node]");
      if (!link) return;
      event.preventDefault();
      jumpToNode(Number(link.dataset.node));
    });

    soundToggle.addEventListener("click", (event) => {
      event.preventDefault();
      soundEnabled = !soundEnabled;
      updateSoundToggleUI();
      syncAudio();
    });

    /* ═══════════════════════════════════════════
       Personal Introduction 羊皮纸弹窗（全局层）
       ═══════════════════════════════════════════ */
    const INTRO_ASSETS = {
      zh: "outputs/assets/images/whole/profile/chinese_profile.svg",
      en: "outputs/assets/images/whole/profile/english_profile.svg",
    };

    const introModal = document.getElementById("introModal");
    const introParchmentImg = document.getElementById("introParchmentImg");
    const introOpenBtn = document.getElementById("introOpenBtn");
    const introCloseHit = document.getElementById("introCloseHit");
    const introLangHit = document.getElementById("introLangHit");

    let introLanguage = "zh";
    let introModalOpen = false;
    let savedScrollY = 0;
    const INTRO_ANIM = { open: 880, close: 460 };

    function applyIntroLanguage() {
      introParchmentImg.src = INTRO_ASSETS[introLanguage];
      introLangHit.setAttribute(
        "aria-label",
        introLanguage === "zh" ? "Switch to English" : "Switch to Chinese"
      );
    }

    function lockBodyScroll() {
      savedScrollY = window.scrollY;
      document.body.classList.add("modal-open");
      document.body.style.position = "fixed";
      document.body.style.top = `-${savedScrollY}px`;
      document.body.style.width = "100%";
    }

    function unlockBodyScroll() {
      document.body.classList.remove("modal-open");
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.width = "";
      window.scrollTo(0, savedScrollY);
    }

    function openIntroModal() {
      if (introModalOpen) return;

      introModalOpen = true;
      introLanguage = "zh";
      applyIntroLanguage();

      introModal.hidden = false;
      introModal.setAttribute("aria-hidden", "false");
      introModal.classList.remove("is-closing");
      introModal.classList.add("is-opening");
      lockBodyScroll();

      requestAnimationFrame(() => {
        introModal.classList.add("is-active");
      });

      window.setTimeout(() => {
        introModal.classList.remove("is-opening");
      }, INTRO_ANIM.open);
    }

    function closeIntroModal() {
      if (!introModalOpen) return;

      introModalOpen = false;
      introModal.classList.add("is-closing");
      introModal.classList.remove("is-active");

      window.setTimeout(() => {
        introModal.hidden = true;
        introModal.setAttribute("aria-hidden", "true");
        introModal.classList.remove("is-closing");
        introLanguage = "zh";
        unlockBodyScroll();
      }, INTRO_ANIM.close);
    }

    function toggleIntroLanguage() {
      introLanguage = introLanguage === "zh" ? "en" : "zh";
      applyIntroLanguage();
    }

    introOpenBtn.addEventListener("click", (event) => {
      event.preventDefault();
      openIntroModal();
    });

    introCloseHit.addEventListener("click", closeIntroModal);
    introLangHit.addEventListener("click", toggleIntroLanguage);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && introModalOpen) {
        closeIntroModal();
      }
    });

    /* ═══════════════════════════════════════════
       自定义光标（default / hover / click）
       ═══════════════════════════════════════════ */
    const cursor = document.getElementById("cursor");
    const cursorCanvas = document.getElementById("cursor-canvas");
    const cursorCtx = cursorCanvas.getContext("2d");
    const CURSOR_HOVER_SELECTOR = "a, button, [data-cursor-hover]";
    const CURSOR_TRAIL = {
      length: 15,
      lerpFactor: 0.2,
      maxRadius: 8,
    };

    let isPointerDown = false;
    let isOverInteractive = false;
    let cursorTrailVisible = true;
    const trailPoints = [];
    const mouse = { x: 0, y: 0 };

    function resizeCursorCanvas() {
      cursorCanvas.width = window.innerWidth;
      cursorCanvas.height = window.innerHeight;
    }

    function setCursorState(state) {
      cursor.classList.remove("cursor-default", "cursor-hover", "cursor-click");
      cursor.classList.add(`cursor-${state}`);
    }

    function updateCursorState() {
      if (isPointerDown) {
        setCursorState("click");
      } else if (isOverInteractive) {
        setCursorState("hover");
      } else {
        setCursorState("default");
      }
    }

    function isInteractiveTarget(target) {
      return target instanceof Element && Boolean(target.closest(CURSOR_HOVER_SELECTOR));
    }

    function drawCursorTrail() {
      cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);

      if (cursorTrailVisible) {
        trailPoints.push({ x: mouse.x, y: mouse.y });
        if (trailPoints.length > CURSOR_TRAIL.length) trailPoints.shift();

        for (let i = 0; i < trailPoints.length; i++) {
          const p = trailPoints[i];

          if (i > 0) {
            p.x += (trailPoints[i - 1].x - p.x) * CURSOR_TRAIL.lerpFactor;
            p.y += (trailPoints[i - 1].y - p.y) * CURSOR_TRAIL.lerpFactor;
          }

          const alpha = (i + 1) / trailPoints.length;
          cursorCtx.fillStyle = `rgba(191, 239, 255, ${alpha * 0.55})`;
          cursorCtx.beginPath();
          cursorCtx.arc(p.x, p.y, CURSOR_TRAIL.maxRadius * alpha, 0, Math.PI * 2);
          cursorCtx.fill();
        }
      }

      requestAnimationFrame(drawCursorTrail);
    }

    document.addEventListener("pointermove", (event) => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
      cursor.style.left = `${event.clientX}px`;
      cursor.style.top = `${event.clientY}px`;
      isOverInteractive = isInteractiveTarget(event.target);
      updateCursorState();
    });

    document.addEventListener("pointerdown", () => {
      isPointerDown = true;
      updateCursorState();
    });

    document.addEventListener("pointerup", () => {
      isPointerDown = false;
      updateCursorState();
    });

    document.addEventListener("pointerleave", (event) => {
      if (event.target === document.documentElement) {
        cursor.style.opacity = "0";
        cursorTrailVisible = false;
        trailPoints.length = 0;
      }
    });

    document.addEventListener("pointerenter", () => {
      cursor.style.opacity = "1";
      cursorTrailVisible = true;
    });

    setCursorState("default");
    resizeCursorCanvas();
    drawCursorTrail();

    /* ═══════════════════════════════════════════
       初始化
       ═══════════════════════════════════════════ */
    resizeCanvas();
    updateSoundToggleUI();
    window.addEventListener("resize", () => {
      resizeCanvas();
      resizeCursorCanvas();
    });
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("pointerdown", () => syncAudio(), { once: true });

    requestAnimationFrame(tick);

    preloadFrames().then(() => {
      introFrame = 1;
      page2Frame = CONFIG.page2StartFrame;
      introDone = false;
      page2Done = false;
      wasOnPage1 = true;
      currentFrame = 1;
      renderFrame(currentFrame);
      syncAudio();
    });

    /*
      拆帧命令（在项目根目录执行）：
      ffmpeg -y -i "outputs/assets/videos/hero-video.mp4" -an \
        -vf "fps=30,scale=1920:-1" -c:v libwebp -q:v 72 -compression_level 4 \
        frames/frame_%04d.webp

      拆完后更新 CONFIG：totalFrames / page2EndFrame = 实际帧数

      本地运行：
      python3 -m http.server 8123
    */
  </script>
</body>
</html>
